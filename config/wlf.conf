# === Power and Split ===
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# === Bluetooth ===
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=32

# === Matrix Responsiveness ===
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=5
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# === HID ===
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# CONFIG_ZMK_HID_INDICATORS=y
# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# === Pointing devices or behaviors ===
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# === White BL (AO3400A-switched) ===
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# === RGB LEDs (gated by AO3407A MOSFET) ===
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y

CONFIG_RGBLED_WIDGET_LED_COUNT=4
CONFIG_RGBLED_WIDGET_SPATIAL_MAPPING=y
CONFIG_RGBLED_WIDGET_ANIMATIONS=y
CONFIG_RGBLED_WIDGET_LED_SHARING=y

CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=0
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=1
CONFIG_RGBLED_WIDGET_LAYER_LED_INDEX=2
CONFIG_RGBLED_WIDGET_SHOW_CAPSLOCK=n

CONFIG_RGBLED_WIDGET_SHARE_TIMEOUT_MS=800
CONFIG_RGBLED_WIDGET_BRIGHTNESS=128

# Connection status (2s display on boot/switch, white for USB, blue for connected/split)
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y
CONFIG_RGBLED_WIDGET_CONN_COLOR_USB=7
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_CONNECTED_DURATION_MS=2000
CONFIG_RGBLED_WIDGET_CONN_DISCONNECTED_DURATION_MS=2500

# Battery status (80-100% Green, 40-79% Yellow, <40% Red, Charging Green pulse)
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_HIGH=2
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_MEDIUM=3
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_LOW=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CRITICAL=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CHARGING=2

# Layer status (Base/Sym/Nav/Num=None, Settings/Dev=Green, Media=Cyan, Extra=Purple)
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_SHARE_BATTERY=y
CONFIG_RGBLED_WIDGET_LAYER_SHARE_CONN=y

# Power gating timeout (turns off AO3407A ext_power after 15s idle)
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=15000

# === Prospector Scanner ===
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="WLF Kbd"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=1

# CONFIG_ZMK_USB_LOGGING=y
